services:
  leadscout:
    build: .
    image: leadscout:latest
    container_name: leadscout
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data          # persist the SQLite database on the host
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
